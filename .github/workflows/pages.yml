# Manual GitHub Pages deploy of the static demo. Nothing runs until someone
# triggers workflow_dispatch. Do not add push/schedule triggers.
name: Deploy demo to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      base_path:
        description: "NEXT_PUBLIC_BASE_PATH (empty for a user site, /DeskOS for a project site)"
        required: false
        default: "/DeskOS"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static demo
        env:
          DESK_DEMO: "1"
          NEXT_PUBLIC_DESK_DEMO: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ inputs.base_path }}
        run: npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
